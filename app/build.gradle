plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blithe.legacysend'
    compileSdk 20

    defaultConfig {
        applicationId 'com.blithe.legacysend'
        minSdk 9
        targetSdk 20
        versionCode 5
        versionName '1.3.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    lint {
        abortOnError true
        checkReleaseBuilds true
        // 本项目不是 Play 商店应用；target 28 用于保留 API 19 到旧式外部存储的一致语义。
        disable 'ExpiredTargetSdkVersion'
    }
}
