plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blithe.legacysend'
    compileSdk 23

    defaultConfig {
        applicationId 'com.blithe.legacysend'
        targetSdk 23
        versionCode 5
        versionName '1.3.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    flavorDimensions "sdkVersion"
    productFlavors {
        standard {
            dimension "sdkVersion"
            minSdkVersion 9
        }
        legacy20 {
            dimension "sdkVersion"
            minSdkVersion 5
        }
    }
    signingConfigs {
        debug {
            storeFile file('LegacySend.keystore')
            storePassword System.getenv("LEGACYSENDKEYCONTREAPP")
            keyAlias "CreaSendLkey"
            keyPassword System.getenv("LEGACYSENDKEYCONTREAPP")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    lint {
        abortOnError true
        checkReleaseBuilds true
        // 本项目不是 Play 商店应用；target 28 用于保留 API 19 到旧式外部存储的一致语义。
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    standardImplementation 'org.conscrypt:conscrypt-android:2.5.3'
}
